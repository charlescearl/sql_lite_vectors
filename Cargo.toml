[package]
name = "sqlite_vec_starter"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[[bin]]
name = "vecgen"
path = "src/bin/vecgen.rs"

[dependencies]
# The core framework for writing SQLite extensions
sqlite-loadable = "0.0.5"
# For parsing vectors passed as JSON strings
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"